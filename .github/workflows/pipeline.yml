name: pipeline

# Environments by branch: dev (CI only, local development), homolog (deploy to the homolog stack),
# main (release + deploy to production). Changes are promoted dev -> homolog -> main through PRs.
on:
  push:
    branches: [main, homolog, dev]
    # The bot commits only under commit-logs/**; pure log commits must not trigger the pipeline.
    paths-ignore:
      - 'commit-logs/**'
      - 'ADR/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main, homolog, dev]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: luizzfernando/commit-mirror

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Lint shell scripts
        run: shellcheck deploy/*.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute next version
        id: compute
        run: |
          revision="$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml | head -n1)"
          base="$(echo "$revision" | cut -d. -f1,2)"
          last="$(git tag -l "v${base}.*" | sed "s/^v${base}\.//" | sort -n | tail -n1)"
          next=$(( ${last:--1} + 1 ))
          version="${base}.${next}"
          # Homolog builds are release candidates of the next production version and are never tagged.
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            version="${version}-rc.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [actionlint, build-test, version]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'homolog')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: REVISION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load and smoke test the built image
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          bash deploy/smoke-test.sh "$IMAGE_NAME:$VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the exact tested image
        run: |
          short="sha-${GITHUB_SHA}"
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:$short"

  release:
    needs: [publish, version]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create tag and release
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          range="${previous:+$previous..}HEAD"
          git log "$range" --pretty='- %s (%h)' --invert-grep --grep='^Commit [0-9]' -- . ':!commit-logs' > notes.md
          [ -s notes.md ] || echo "- Maintenance release" > notes.md
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file notes.md

  deploy:
    needs: [publish, release, version]
    # release is skipped on homolog, so only a failed or cancelled run blocks the deploy.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    # Environment secrets override the repository-level ones: homolog defines its own VPS_SSH_KEY,
    # whose forced command runs the deploy.sh of the homolog stack.
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$VERSION"
      - name: Flag the release when the deploy fails
        if: failure() && github.ref_name == 'main'
        run: |
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --prerelease \
            --notes "Deploy failed and was rolled back. This version is not live."
