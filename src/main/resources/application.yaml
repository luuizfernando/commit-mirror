spring:
  application:
    name: commit-mirror
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commit_mirror}
    username: ${POSTGRES_USER:commit_mirror}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    '[org.springframework.web.client]': INFO
