# Install as /etc/nginx/conf.d/commit-mirror.conf on the VPS, then: certbot --nginx -d bot.luuizfernando.tech
# Certbot adds the TLS directives (listen 443 ssl, certificates) and the HTTP -> HTTPS redirect to this server block.
# Only POST /telegram/webhook is proxied; the actuator (port 8081) is never exposed.

limit_req_zone $binary_remote_addr zone=commit_mirror_webhook:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bot.luuizfernando.tech;

    server_tokens off;
    client_max_body_size 64k;

    location = /telegram/webhook {
        limit_req zone=commit_mirror_webhook burst=20 nodelay;
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
