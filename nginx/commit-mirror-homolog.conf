# Homolog stack (branch homolog). Kept apart from nginx.conf so installing it never touches the TLS
# directives certbot already added to the production file.
# Install as /etc/nginx/conf.d/commit-mirror-homolog.conf on the VPS, then: certbot --nginx -d bot-homolog.luuizfernando.tech
# The app is published on 127.0.0.1:8090 (APP_HOST_PORT in the homolog .env).

limit_req_zone $binary_remote_addr zone=commit_mirror_homolog_webhook:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bot-homolog.luuizfernando.tech;

    server_tokens off;
    client_max_body_size 64k;

    location = /telegram/webhook {
        limit_req zone=commit_mirror_homolog_webhook burst=20 nodelay;
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
